name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: 编译检查（含测试目标）
        run: cargo check --workspace --all-targets

      - name: Test（宿主全量测试，无需硬件/网络/broker）
        run: cargo test --workspace

      # 风格告警不阻断（当前 sekai-router 有 5 条既有 clippy 告警）；
      # 编译错误仍会失败。本地用 scripts/gate.sh 跑同一套。
      - name: Clippy（告警不阻断）
        run: cargo clippy --workspace --all-targets

      # 真实 API 测试默认 ignored；只有配置了仓库 secret 时才跑。
      - name: 真实 API（有 DEEPSEEK_API_KEY 时）
        if: ${{ env.DEEPSEEK_API_KEY != '' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEKAI_REAL_API: "1"
        run: cargo test -p sekai-router --test real_api -- --ignored

  rust-windows:
    name: Rust (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 覆盖 Windows 专属路径：Job 对象/taskkill 杀进程树、cmd /C 编码、
      # crossterm TUI 编译。
      - name: Test（Windows 全量测试）
        run: cargo test --workspace

  plugin:
    name: DSH plugin smoke（无 Rust 依赖）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/sekai-dsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 语法检查
        run: node --check lib/index.js && node --check lib/shared.js && node --check lib/router.js && node --check lib/worker.js && node --check scripts/smoke.mjs

      - name: 冒烟（假 serve/假 worker 驱动）
        run: node scripts/smoke.mjs

      # 一键安装器的语法检查与离线测试（fixture 在临时 DSH_HOME 中，不碰 ~/.dsh）。
      # 本 job 的 working-directory 是 plugins/sekai-dsh，故脚本用 ../../ 指回仓库根。
      - name: 安装器语法检查
        run: node --check ../../scripts/install-dsh-plugin.mjs && node --check ../../scripts/install-dsh-plugin.test.mjs

      - name: 安装器离线测试
        run: node --test ../../scripts/install-dsh-plugin.test.mjs
