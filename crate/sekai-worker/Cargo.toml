[package]
name = "sekai-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sekai PC Worker 启动层：宿主进程 Worker，通过直连链路（stdio/TCP，V1 帧，非 MQTT broker）与 Router 通信"

[lib]
name = "sekai_worker"
path = "src/lib.rs"

[[bin]]
name = "sekai-worker"
path = "src/bin/sekai-worker.rs"

[dependencies]
sekai = { path = "../sekai" }
sekai-gpio = { path = "../sekai-gpio" }

[features]
uart-bridge = ["dep:serialport", "dep:getrandom"]

[dependencies.serialport]
version = "4"
default-features = false
optional = true

[dependencies.getrandom]
version = "0.3"
features = ["std"]
optional = true

[[bin]]
name = "stm32-bridge"
path = "src/bin/stm32-bridge.rs"
required-features = ["uart-bridge"]
