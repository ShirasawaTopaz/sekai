[package]
name = "sekai-stm32"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
firmware = []
blue-pill = ["firmware", "dep:cortex-m", "dep:cortex-m-rt", "dep:linked_list_allocator", "dep:stm32f1", "sekai-gpio/stm32f1"]
discovery = ["firmware", "dep:cortex-m", "dep:cortex-m-rt", "dep:linked_list_allocator", "dep:stm32f4", "sekai-gpio/stm32f4"]

[dependencies]
sekai = { path = "../sekai" }
sekai-gpio = { path = "../sekai-gpio" }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"], optional = true }
cortex-m-rt = { version = "0.7", optional = true }
linked_list_allocator = { version = "0.10", default-features = false, optional = true }
stm32f1 = { version = "0.16", default-features = false, features = ["stm32f103", "critical-section", "rt"], optional = true }
stm32f4 = { version = "0.16", default-features = false, features = ["stm32f407", "critical-section", "rt"], optional = true }

[[bin]]
name = "sekai-stm32"
path = "src/main.rs"
required-features = ["firmware"]
