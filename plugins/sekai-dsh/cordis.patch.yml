# sekai-dsh bundle patch：把 router 与 worker 两个 Host 插件挂进 DSH。
#
# 把本包加入 profile 的 bundles（dsh plugin add @sekai/dsh-plugin，或在
# profile 的 cordis.patch.yml / bundles 配置中列出）即自动应用本补丁——
# 无需手工编辑任何 patch 文件。两行默认 config 见下；已保存的 profile
# 行覆盖优先于本补丁默认值生效。

- insert:
    - id: sekai-router
      name: '@sekai/dsh-plugin/router'
      config:
        enabled: true
        # 二进制不写死路径：解析顺序 config routerBin > SEKAI_ROUTER_BIN > PATH。
        # 构建后（cargo build --release -p sekai-router）把 target/release 加入
        # PATH、设环境变量，或在 profile 里覆盖 routerBin 为绝对路径。
    - id: sekai-worker
      name: '@sekai/dsh-plugin/worker'
      config:
        enabled: true
        # 同理：workerBin > SEKAI_WORKER_BIN > PATH 上的 sekai-worker。
